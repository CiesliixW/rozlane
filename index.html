<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rozlane.pl — strona w budowie</title>
<meta name="description" content="rozlane.pl — pracujemy nad odświeżeniem strony. Zaglądajcie niebawem!">
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #1c1a22 0%, #0c0a10 70%);
    color: #f3efe9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 480px;
  }
  .mark {
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #c9a876;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.25;
    margin: 0 0 16px;
    font-weight: 600;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #b8b2bd;
    margin: 0 0 32px;
  }
  .dots {
    display: inline-flex;
    gap: 6px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c9a876;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">rozlane.pl</div>
    <h1>Pracujemy nad stroną</h1>
    <p>Wracamy niebawem z odświeżoną ofertą odlewek perfum. Dziękujemy za cierpliwość.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
